        function toggleSidebar() {
            const sidebar = document.getElementById('mobileSidebar');
            const overlay = document.getElementById('sidebarOverlay');
            if (!sidebar || !overlay) return;
            const isClosed = sidebar.classList.contains('translate-x-full');
            if (isClosed) {
                sidebar.classList.remove('translate-x-full');
                overlay.classList.remove('hidden');
                setTimeout(() => overlay.classList.remove('opacity-0'), 10);
                document.body.style.overflow = 'hidden';
            } else {
                sidebar.classList.add('translate-x-full');
                overlay.classList.add('opacity-0');
                setTimeout(() => overlay.classList.add('hidden'), 300);
                document.body.style.overflow = '';
            }
        }
    </script>
    <script>
    (function () {
        'use strict';

        var TURF = window.EMS_TURF;
        var BK = window.EMS_BOOKINGS;
        var UI = window.EMS_UI;
        var AUTH = window.EMS_AUTH;

        var state = {
            groundId: null,
            name: '',
            location: '',
            price: 0,
            image: '',
            selectedSlots: [],
            selectedDate: null,
            slots: [],
            taxRate: 0.18
        };

        // ── Modal (global exposure for inline onclick) ───────────────

        window.closeModal = function () {
            var modal = document.getElementById('uiModal');
            var modalContent = document.getElementById('uiModalContent');
            modal.classList.add('opacity-0');
            modalContent.classList.add('scale-95');
            setTimeout(function () { modal.classList.add('hidden'); }, 300);
        };

        function openModal(title, content) {
            var modal = document.getElementById('uiModal');
            var modalContent = document.getElementById('uiModalContent');
            document.getElementById('uiModalTitle').innerText = title;
            document.getElementById('uiModalBody').innerHTML = content;
            modal.classList.remove('hidden');
            setTimeout(function () {
                modal.classList.remove('opacity-0');
                modalContent.classList.remove('scale-95');
            }, 10);
        }

        // Close modal on backdrop click
        document.querySelectorAll('#uiModal').forEach(function (m) {
            m.addEventListener('click', function (e) {
                if (e.target === m) window.closeModal();
            });
        });

        // ── Date Generation ─────────────────────────────────────────

        function generateDates() {
            var container = document.getElementById('dateSelector');
            container.innerHTML = '';
            var today = new Date();
            var days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
            var months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

            for (var i = 0; i < 7; i++) {
                var date = new Date(today);
                date.setDate(today.getDate() + i);
                var dateStr = date.getFullYear() + '-' + String(date.getMonth() + 1).padStart(2, '0') + '-' + String(date.getDate()).padStart(2, '0');
                var isSelected = i === 0;

                var btn = document.createElement('button');
                var activeClass = isSelected
                    ? 'bg-custom-light text-white border-custom-light shadow-md'
                    : 'bg-white text-custom-dark border-gray-200 hover:border-custom-light/50';
                btn.className = 'flex-none flex flex-col items-center justify-center w-16 h-20 rounded-xl border-2 transition-all duration-200 ' + activeClass + ' date-btn';
                btn.setAttribute('data-date', dateStr);
                btn.innerHTML =
                    '<span class="text-xs font-bold mb-1 opacity-80">' + days[date.getDay()] + '</span>' +
                    '<span class="text-xl font-bold">' + date.getDate() + '</span>' +
                    '<span class="text-[10px] font-bold opacity-80">' + months[date.getMonth()] + '</span>';

                btn.addEventListener('click', function () {
                    var self = this;
                    document.querySelectorAll('.date-btn').forEach(function (b) {
                        b.className = 'flex-none flex flex-col items-center justify-center w-16 h-20 rounded-xl border-2 transition-all duration-200 bg-white text-custom-dark border-gray-200 hover:border-custom-light/50 date-btn';
                    });
                    self.className = 'flex-none flex flex-col items-center justify-center w-16 h-20 rounded-xl border-2 transition-all duration-200 bg-custom-light text-white border-custom-light shadow-md date-btn';
                    state.selectedDate = self.getAttribute('data-date');
                    state.selectedSlots = [];
                    loadSlots(state.selectedDate);
                    updateSummary();
                });
                container.appendChild(btn);

                if (isSelected) {
                    state.selectedDate = dateStr;
                }
            }
        }

        // ── Slot Loading from API ────────────────────────────────────

        function loadSlots(dateStr) {
            var container = document.getElementById('slotGrid');
            container.innerHTML = '<div class="col-span-full py-8 text-center"><div class="inline-block w-6 h-6 border-3 border-custom-light border-t-transparent rounded-full animate-spin mr-2"></div><span class="text-gray-500 font-medium text-sm">Loading slots...</span></div>';

            if (!state.groundId) {
                // No groundId — generate mock slots as fallback
                console.warn('No groundId provided, generating demo slots.');
                renderSlots(generateDemoSlots());
                return;
            }

            TURF.getSlots(state.groundId, dateStr).then(function (result) {
                if (result.ok) {
                    var data = result.data;
                    var slotList = [];
                    if (data && Array.isArray(data.data)) {
                        slotList = data.data;
                    } else if (data && Array.isArray(data)) {
                        slotList = data;
                    }
                    renderSlots(slotList);
                } else {
                    // If API fails, still show all slots (assume available)
                    console.warn('Slot fetch failed, showing all slots:', result.data);
                    renderSlots([]);
                }
            }).catch(function () {
                console.warn('Slot fetch error, showing all slots.');
                renderSlots([]);
            });
        }

        function generateDemoSlots() {
            var slots = [];
            for (var h = 6; h <= 23; h++) {
                var hour = String(h).padStart(2, '0');
                slots.push({ startTime: hour + ':00', endTime: hour + ':59', available: Math.random() > 0.3 });
            }
            return slots;
        }

        function renderSlots(slots) {
            var container = document.getElementById('slotGrid');
            container.innerHTML = '';

            if (slots.length === 0) {
                // No slot data from API — generate standard slots all available
                slots = generateDemoSlots();
            }

            slots.forEach(function (slot) {
                var timeLabel = slot.startTime || slot.time || slot;
                // Strip seconds if present
                if (typeof timeLabel === 'string' && timeLabel.length === 8 && timeLabel.endsWith(':00')) {
                    // Already HH:MM format
                } else if (typeof timeLabel === 'string') {
                    timeLabel = timeLabel.substring(0, 5);
                }

                var isAvailable = slot.available !== false;
                var slotId = slot._id || slot.id || 'demo-' + timeLabel.replace(':', '');

                var btn = document.createElement('button');
                if (!isAvailable) {
                    btn.className = 'py-2 px-1 rounded-lg border-2 border-gray-100 bg-gray-50 text-gray-300 font-bold text-xs sm:text-sm cursor-not-allowed';
                    btn.innerText = timeLabel;
                    btn.disabled = true;
                    btn.title = 'Already booked';
                } else {
                    btn.className = 'slot-btn py-2 px-1 rounded-lg border-2 border-gray-200 bg-white text-custom-dark font-bold text-xs sm:text-sm hover:border-custom-light hover:text-custom-light transition-colors';
                    btn.innerText = timeLabel;
                    btn.dataset.time = timeLabel;
                    btn.dataset.slotId = slotId;
                    btn.addEventListener('click', function () { toggleSlot(btn); });
                }
                container.appendChild(btn);
            });
        }

        // ── Slot Selection ───────────────────────────────────────────

        function toggleSlot(btn) {
            var time = btn.dataset.time;
            var idx = state.selectedSlots.indexOf(time);

            if (idx > -1) {
                state.selectedSlots.splice(idx, 1);
                btn.classList.remove('bg-custom-light', 'text-white', 'border-custom-light', 'shadow-md');
                btn.classList.add('bg-white', 'text-custom-dark', 'border-gray-200');
            } else {
                state.selectedSlots.push(time);
                btn.classList.remove('bg-white', 'text-custom-dark', 'border-gray-200');
                btn.classList.add('bg-custom-light', 'text-white', 'border-custom-light', 'shadow-md');
            }
            updateSummary();
        }

        // ── Summary & Payment ───────────────────────────────────────

        function updateSummary() {
            var count = state.selectedSlots.length;
            var subtotal = count * state.price;
            var taxes = subtotal * state.taxRate;
            var total = subtotal + taxes;

            document.getElementById('summarySlotCount').innerText = count;
            document.getElementById('summarySubtotal').innerText = subtotal.toLocaleString('en-IN');
            document.getElementById('summaryTaxes').innerText = taxes.toLocaleString('en-IN', { maximumFractionDigits: 0 });
            document.getElementById('summaryTotal').innerText = total.toLocaleString('en-IN', { maximumFractionDigits: 0 });

            var payBtn = document.getElementById('proceedToPayBtn');
            if (count > 0) {
                payBtn.disabled = false;
                payBtn.innerText = 'Pay ₹' + total.toLocaleString('en-IN', { maximumFractionDigits: 0 });
                payBtn.onclick = function () { initiateBooking(); };
            } else {
                payBtn.disabled = true;
                payBtn.innerText = 'Proceed to Pay';
                payBtn.onclick = null;
            }
        }

        // ── Booking Flow ─────────────────────────────────────────────

        function initiateBooking() {
            var user = AUTH.getUser();
            if (!user) {
                openModal('Login Required',
                    '<div class="text-center py-6">' +
                        '<i class="fa-solid fa-user-lock text-4xl text-gray-300 mb-4"></i>' +
                        '<p class="text-gray-600 font-medium mb-6">Please login to book a slot.</p>' +
                        '<a href="auth.html" class="block w-full bg-custom-light text-white py-3 rounded-lg font-bold shadow-md hover:bg-custom-lightHover transition">Go to Login</a>' +
                    '</div>'
                );
                return;
            }

            var btn = document.getElementById('proceedToPayBtn');
            btn.disabled = true;
            btn.innerHTML = '<div class="inline-block w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin mr-2"></div> Processing...';

            // Build slot IDs — for demo use time-based IDs, real API expects slot UUIDs
            var slotIds = state.selectedSlots.map(function (time) {
                var slot = findSlotByTime(time);
                return slot && slot._id ? slot._id : time.replace(':', '');
            });

            var bookingData = {
                groundId: state.groundId,
                date: state.selectedDate,
                slotIds: slotIds,
                teamName: user.name || '',
                contactName: user.name || '',
                contactPhone: user.phone || ''
            };

            // Step 1: Create the booking
            TURF.createBooking(bookingData).then(function (result) {
                if (result.ok) {
                    var booking = result.data.data || result.data;
                    // Step 2: Initiate payment for the booking
                    return BK.initiatePayment(
                        { bookingId: booking.bookingId || booking._id },
                        function (paymentSessionId, orderId, bookingId) {
                            // Redirect to Cashfree payment page
                            showSuccess(booking);
                        },
                        function (errorMsg) {
                            showError(errorMsg || 'Payment initiation failed. Please try again.');
                            btn.disabled = false;
                            updateSummary();
                        }
                    );
                } else {
                    showError(result.data && result.data.message ? result.data.message : 'Booking failed. Please try again.');
                    btn.disabled = false;
                    updateSummary();
                }
            }).catch(function (err) {
                showError(err.message || 'Something went wrong. Please try again.');
                btn.disabled = false;
                updateSummary();
            });
        }

        function findSlotByTime(time) {
            for (var i = 0; i < state.slots.length; i++) {
                var s = state.slots[i];
                var sTime = (s.startTime || s.time || '').toString().substring(0, 5);
                if (sTime === time) return s;
            }
            return null;
        }

        function showSuccess(booking) {
            var count = state.selectedSlots.length;
            var btn = document.getElementById('proceedToPayBtn');
            btn.disabled = false;
            updateSummary();

            openModal('Booking Confirmed!',
                '<div class="text-center py-6">' +
                    '<div class="w-20 h-20 rounded-full bg-green-50 text-green-500 flex items-center justify-center mx-auto mb-6 shadow-inner border border-green-100">' +
                        '<i class="fa-solid fa-check-circle text-5xl"></i>' +
                    '</div>' +
                    '<h4 class="text-2xl font-bold text-custom-dark mb-2">Booking Confirmed!</h4>' +
                    '<p class="text-gray-500 mb-2 font-medium">' + count + ' slot(s) booked at <span class="text-custom-dark font-bold">' + UI.escapeHtml(state.name) + '</span></p>' +
                    '<p class="text-xs text-gray-400 mb-6">Ref: ' + (booking.bookingId || booking._id || 'N/A') + '</p>' +
                    '<a href="my-bookings.html" class="block w-full bg-custom-light text-white py-3.5 rounded-xl font-bold shadow-lg hover:bg-custom-lightHover transition-colors">View My Bookings</a>' +
                    '<a href="index.html" class="block w-full bg-gray-100 text-custom-dark py-3 rounded-xl font-bold mt-3 hover:bg-gray-200 transition">Return Home</a>' +
                '</div>'
            );
        }

        function showError(message) {
            UI.toast(message, 'error');
        }

        // ── Auth ─────────────────────────────────────────────────────

        function updateHeaderAuth() {
            var user = AUTH.getUser();
            // Simple header — just logo, no login button on this page
        }

        // ── Init ─────────────────────────────────────────────────────

        function init() {
            var urlParams = new URLSearchParams(window.location.search);

            // Support both URL param styles from index.html and movie-cinemas.html
            state.groundId = urlParams.get('groundId') || urlParams.get('id') || '';
            state.name = urlParams.get('name') || 'Turf Booking';
            state.location = urlParams.get('location') || 'Location';
            state.price = parseInt(urlParams.get('price')) || 0;
            state.image = urlParams.get('image') || 'https://images.unsplash.com/photo-1552667466-07770ae110d0?q=80&w=600&auto=format&fit=crop';

            // If no groundId but we have an id, try to use it
            if (!state.groundId) {
                state.groundId = urlParams.get('id') || '';
            }

            // Populate DOM
            document.getElementById('bookingTurfName').innerText = state.name;
            document.getElementById('bookingTurfLocation').innerHTML = '<i class="fa-solid fa-location-dot mr-2 text-custom-light"></i> ' + UI.escapeHtml(state.location);
            document.getElementById('bookingTurfPrice').innerText = state.price;
            document.getElementById('bookingTurfImage').src = state.image;

            generateDates();
            AUTH.restoreSession().then(updateHeaderAuth);
            if (state.selectedDate) {
                loadSlots(state.selectedDate);
            }
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    })();
